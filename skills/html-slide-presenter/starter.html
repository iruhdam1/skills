<!doctype html>
<html lang="en" data-active-slide="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML presentation starter</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#17271e;color:#f7faf4;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{height:100%;padding:clamp(24px,5vw,80px);padding-bottom:110px}.slide{height:100%;max-width:1200px;margin:auto;display:flex;flex-direction:column;justify-content:center;gap:24px}.slide[hidden],aside.notes{display:none!important}.slide small{color:#c2e5b5;font-size:clamp(16px,2vw,22px)}h1,h2,p{margin:0}h1,h2{font-size:clamp(32px,6vw,88px);line-height:1.06;max-width:16ch;letter-spacing:-.035em}p,li{font-size:clamp(18px,2.7vw,36px);line-height:1.4;max-width:38ch}ul{padding-left:1.2em;margin:0}li+li{margin-top:12px}.accent{color:#c9f59b}nav{position:fixed;bottom:0;left:0;right:0;min-height:80px;padding:16px 5vw;display:flex;align-items:center;gap:12px;background:#17271e;border-top:1px solid #53644e}button{font:inherit;font-size:16px;color:inherit;background:transparent;border:1px solid #809375;border-radius:6px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #c9f59b;outline-offset:3px}output{margin-right:auto;color:#c2e5b5;font-variant-numeric:tabular-nums}@media(max-height:560px){main{padding:22px 5vw 88px}.slide{gap:12px}h1,h2{font-size:clamp(28px,5vw,56px)}p,li{font-size:clamp(16px,2vw,24px)}nav{min-height:68px;padding:10px 5vw}}</style>
</head>
<body>
<main class="deck-stage">
<section class="slide active" data-slide-index="0" aria-label="Your presentation title">
<small>Your audience · Your talk duration</small><h1>Your presentation <span class="accent">title.</span></h1><p>Replace this sentence with the idea your audience should remember.</p>
<script type="application/json" class="slide-notes">
{"title": "Your presentation title", "script": "Replace this with your opening, grounded in your own material.", "notes": ["Add a cue for yourself."]}
</script>
</section>
<section class="slide" hidden data-slide-index="1" aria-label="Your supporting example">
<small>Make your point concrete</small><h2>Your supporting <span class="accent">example.</span></h2><p>Replace this with one real example from your material.</p>
<script type="application/json" class="slide-notes">
{"title": "Your supporting example", "script": "Explain the example without inventing facts or results.", "notes": ["Pause before moving on."]}
</script>
</section>
</main>
<nav aria-label="Presentation controls"><output id="progress" aria-live="polite">1 / 2</output><button id="previous" type="button" disabled>Previous</button><button id="next" type="button">Next</button></nav>
<script>
(() => {
  const slides = Array.from(document.querySelectorAll('.slide'));
  const previous = document.getElementById('previous');
  const next = document.getElementById('next');
  const progress = document.getElementById('progress');
  window.currentSlide = 0;
  window.goToSlide = function(index) {
    index = Math.max(0, Math.min(slides.length - 1, Math.trunc(Number(index) || 0)));
    window.currentSlide = index;
    document.documentElement.dataset.activeSlide = String(index);
    slides.forEach((slide, i) => {
      slide.hidden = i !== index;
      slide.classList.toggle('active', i === index);
      slide.setAttribute('aria-hidden', String(i !== index));
    });
    previous.disabled = index === 0;
    next.disabled = index === slides.length - 1;
    progress.textContent = `${index + 1} / ${slides.length}`;
    window.dispatchEvent(new CustomEvent('slidechange', { detail: { index } }));
  };
  previous.addEventListener('click', () => window.goToSlide(window.currentSlide - 1));
  next.addEventListener('click', () => window.goToSlide(window.currentSlide + 1));
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName) || event.target.isContentEditable) return;
    let index;
    if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(event.key)) index = window.currentSlide + 1;
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) index = window.currentSlide - 1;
    else if (event.key === 'Home') index = 0;
    else if (event.key === 'End') index = slides.length - 1;
    else return;
    event.preventDefault();
    window.goToSlide(index);
  });
  window.goToSlide(0);
})();
</script>
</body>
</html>
